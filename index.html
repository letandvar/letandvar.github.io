<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./favicon/96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/180.png" />


    <title>LETANDVAR</title>
    <style>
        @font-face {
            font-family: 'sf';
            src: url("./src/SFPRODISPLAYREGULAR.OTF");
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            border: none;
            user-select: none;
            box-sizing: border-box;
            font-family: 'sf', 'Verdana, Geneva, Tahoma, sans-serif';
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #1F1F1F;
            display: flex;
            justify-content: center;
        }

        #container {
            width: 100%;
            /* max-width: 400px; */
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }

        #logo {
            width: 100%;
            aspect-ratio: 1/0.5;
            background-color: #1B1B1B;
            background-image: url("./src/logo.jpg");
            background-size: 50%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: end;
            border-radius: 8px;
            border: 1px solid #4F4F50;
            overflow: hidden;
            flex-shrink: 0;
        }

        #title {
            width: 100%;
            font-size: 25px;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, transparent, #000);
            text-align: center;
            padding: 20% 0 15px 0;
            transition: all .2s ease;
        }

        #message {
            color: #aaa;
            text-align: center;
            margin: 10px 0;

        }

        #buttonsContainer {
            gap: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            /* align-content: start; */
            /* align-items: stretch; */
        }

        .button {
            height: 40px;
            display: flex;
            background-color: #2E2E2F;
            box-shadow: 0 0 5px 0 #0003;
            border-radius: 5px;
            cursor: pointer;
            align-items: center;
            gap: 5px;
            transition: gap .3s ease;

        }

        .icon {
            height: 100%;
            aspect-ratio: 1;
            background-size: 60%;
            background-position: center;
            background-repeat: no-repeat;
            filter: invert(1);
            opacity: .9;
        }

        .title {
            color: #E7E7E8;
            letter-spacing: 1px;
            line-height: 1;
            font-size: 17px;
        }

        .btn_spotify {
            background-color: #1DD05D;
            box-shadow: 0 0 5px 0 #1DD05D;
        }

        .title_telegram {
            font-family: 'sf';
        }

        .btn_applemusic {
            background-color: #D60014;
            box-shadow: 0 0 5px 0 #D60014;
        }

        .button:active {
            background-color: #404041;
            gap: 30px;
        }

        .btn_spotify:active {
            background-color: #1db151;
        }

        .btn_applemusic:active {
            background-color: #b10012;
        }

        .icon_facebook {
            background-size: 67%;
        }

        .icon_dailymotion {
            background-size: 75%;
        }

        .icon_upscrolled {
            background-size: 50%;
            background-position: 50% 55%;
        }

        @media (hover: hover) {
            .button:hover {
                gap: 30px;
            }
        }
    </style>
</head>

<body>
    <div id="container">

        <div id="logo">
            <p id="title">@LETANDVAR</p>
        </div>

        <p id="message">[Follow &&|| Talk to] + me</p>

        <div id="buttonsContainer"></div>

    </div>

    <script>
        const lm = {
            facebook: {
                link: "facebook.com/letandvar",
                title: "Facebook",
                id: "3128208"
            },
            instagram: {
                link: "instagram.com/letandvar",
                title: "Instagram",
                id: "2111491"
            },
            x: {
                link: "x.com/let_and_var",
                title: "X",
                id: "5968958"
            },
            tiktok: {
                link: "tiktok.com/@letandvar",
                title: "TikTok",
                id: "3046120"
            },
            telegram: {
                link: "t.me/letandvar",
                title: "Telegram",
                id: "15047617"
            },
            youtube: {
                link: "youtube.com/@letandvar",
                title: "YouTube",
                id: "2111795"
            },
            dailymotion: {
                link: "dailymotion.com/letandvar",
                title: "Dailymotion",
                id: "dailymotion"
            },
            github: {
                link: "github.com/letandvar",
                title: "Github",
                id: "4926624"
            },
            pinterest: {
                link: "pinterest.com/letandvar",
                title: "Pinterest",
                id: "152817"
            },
            upscrolled: {
                link: "upscrolled.com/@letandvar",
                title: "Upscrolled",
                id: "upscrolled"
            },
            spotify: {
                link: "open.spotify.com/artist/1JvwkUGJ4vPJMzZHDaJuos",
                title: "Listen on Spotify",
                id: "49097"
            },
            applemusic: {
                link: "music.apple.com/ma/artist/letandvar/1867509230",
                title: "Listen on Apple Music",
                id: "747"
            },
            email: {
                link: "letandvar8@gmail.com",
                title: "letandvar8@gmail.com",
                id: "3059486"
            }
        };


        const buttonsContainer = document.getElementById('buttonsContainer');

        Object.entries(lm).forEach(([name, item]) => {

            let ttl = item.title;
            let link;
            let id = item.id;
            let subId = id.slice(0, id.length - 3) || 0;

            if (isNaN(id)) {
                link = `./src/${id}.png`;
            } else {
                link = `https://cdn-icons-png.flaticon.com/64/${subId}/${id}.png`;
            }




            const button = document.createElement('div');
            button.className = `button btn_${name}`;
            button.onclick = () =>
                window.open((name !== 'email' ? 'https://' : 'mailto:') + item.link);

            const title = document.createElement('p');
            title.className = `title title_${name}`;
            title.textContent = item.title;

            const icon = document.createElement('div');
            icon.style.backgroundImage = `url(${link})`;
            icon.className = `icon icon_${name}`;

            button.appendChild(icon);
            button.appendChild(title);
            buttonsContainer.appendChild(button);
        });
    </script>
</body>

</html>
