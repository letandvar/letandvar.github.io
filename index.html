<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./favicon/96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/180.png" />


    <title>LETANDVAR</title>
    <style>
        @font-face {
            font-family: 'sf';
            src: url("./src/SFPRODISPLAYREGULAR.OTF");
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            border: none;
            user-select: none;
            box-sizing: border-box;
            font-family: 'sf', 'Verdana, Geneva, Tahoma, sans-serif';
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #1F1F1F;
            display: flex;
            flex-direction: column;
        }

        body {
            gap: 10px;
            padding: 10px;
        }

        #header {
            height: 60px;
            display: flex;
            background-color: #ffffff0a;
            border: 1px solid #fff3;
            align-items: center;
            gap: 15px;
        }

        #logo {
            height: 100%;
            aspect-ratio: 1;
            background-image: url("./src/logo-t.png");
            background-size: 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            border-right: 1px dashed #fff3;
            position: relative;
        }

        #logo::after {
            content: '';
            width: 100%;
            height: 100%;
            top: 0;
            position: absolute;
            background: inherit;
            filter: blur(5px);
            transform: scale(1.2);
            opacity: .3;
        }

        #title {
            font-size: 25px;
            color: #fff;
            letter-spacing: 1px;
        }

        #message {
            color: #aaa;
            text-align: center;
            margin: 10px 0;

        }

        #buttonsContainer {
            flex: 1;
            gap: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            align-content: start;
            overflow-y: auto;
            background-color: #ffffff0a;
            border: 1px solid #fff3;
            padding: 10px;
        }

        #buttonsContainer::-webkit-scrollbar {
            width: 12px;
        }

        #buttonsContainer::-webkit-scrollbar-thumb {
            background-color: #444;
            border: 4px solid #272727;
            cursor: pointer;
        }

        .button {
            height: 40px;
            display: flex;
            background-color: #2E2E2F;
            border: 1px solid #fff2;
            box-shadow: 0 0 5px 0 #0003;
            cursor: pointer;
            align-items: center;
            gap: 5px;
            transition: gap .3s ease;

        }

        .icon {
            height: 100%;
            aspect-ratio: 1;
            background-size: 60%;
            background-position: center;
            background-repeat: no-repeat;
            filter: invert(1);
            opacity: .9;
        }

        .title {
            color: #E7E7E8;
            letter-spacing: 1px;
            line-height: 1;
            font-size: 17px;
        }

        .btn_spotify {
            background-color: #1DD05D;
            box-shadow: 0 0 5px 0 #1DD05D;
        }

        .title_telegram {
            font-family: 'sf';
        }

        .btn_applemusic {
            background-color: #D60014;
            box-shadow: 0 0 5px 0 #D60014;
        }

        .button:active {
            background-color: #404041;
            gap: 30px;
        }

        .btn_spotify:active {
            background-color: #1db151;
        }

        .btn_applemusic:active {
            background-color: #b10012;
        }

        .icon_facebook {
            background-size: 67%;
        }

        .icon_dailymotion {
            background-size: 75%;
        }

        .icon_upscrolled {
            background-size: 50%;
            background-position: 50% 55%;
        }

        #footer {
            background-color: #ffffff0a;
            border: 1px solid #fff3;
            display: flex;
            justify-content: center;
            gap: 7px;
            color: #fffa;
            letter-spacing: 0.8px;
            padding: 7px;
        }

        #email {
            color: #c8e621;
            cursor: pointer;
            transition: text-shadow 100ms ease;
        }

        #donate {
            color: #e932d0;
            cursor: pointer;
            transition: text-shadow 100ms ease;
        }

        @media(max-width:540px) {
            #header {
                gap: 0;
            }

            #title {
                margin: 0 auto;
            }
        }

        @media (hover: hover) {

            .button:hover {
                gap: 30px;
            }

            #email:hover {
                text-shadow: 0 0 15px #c8e621;
            }

            #donate:hover {
                text-shadow: 0 0 15px #e932d0;
            }
        }

        .icon_ko-fi {
            filter: invert(0);
        }
    </style>
</head>

<body>

    <div id="header">
        <div id="logo"></div>
        <p id="title">LETANDVAR</p>
    </div>

    <div id="buttonsContainer"></div>

    <div id="footer">
        <p id="email">letandvar8@gmail.com</p>
        <p class="dot">•</p>
        <p id="donate">Donate</p>
        <p class="dot">•</p>
        <p id="copyright">&copy; Copyright Null</p>
    </div>

    <script>
        const lm = {
            facebook: {
                link: "facebook.com/letandvar",
                title: "Facebook",
                id: "3128208"
            },
            "instagram": {
                link: "instagram.com/letandvar",
                title: "Instagram",
                id: "2111491"
            },
            "x": {
                link: "x.com/let_and_var",
                title: "X",
                id: "5968958"
            },
            "tiktok": {
                link: "tiktok.com/@letandvar",
                title: "TikTok",
                id: "3046120"
            },
            "telegram": {
                link: "t.me/letandvar",
                title: "Telegram",
                id: "15047617"
            },
            "youtube": {
                link: "youtube.com/@letandvar",
                title: "YouTube",
                id: "2111795"
            },
            "dailymotion": {
                link: "dailymotion.com/letandvar",
                title: "Dailymotion",
                id: "dailymotion"
            },
            "github": {
                link: "github.com/letandvar",
                title: "Github",
                id: "4926624"
            },
            "pinterest": {
                link: "pinterest.com/letandvar",
                title: "Pinterest",
                id: "152817"
            },
            "upscrolled": {
                link: "upscrolled.com/@letandvar",
                title: "Upscrolled",
                id: "upscrolled"
            },
            "dev.to": {
                link: "dev.to/letandvar",
                title: "dev.to",
                id: "5969023"
            },
            "spotify": {
                link: "open.spotify.com/artist/1JvwkUGJ4vPJMzZHDaJuos",
                title: "Listen on Spotify",
                id: "49097"
            },
            "applemusic": {
                link: "music.apple.com/ma/artist/letandvar/1867509230",
                title: "Listen on Apple Music",
                id: "747"
            }
        };


        const buttonsContainer = document.getElementById('buttonsContainer');

        Object.entries(lm).forEach(([name, item]) => {

            let ttl = item.title;
            let link;
            let id = item.id;
            let subId = id.slice(0, id.length - 3) || 0;

            if (isNaN(id)) {
                link = `./src/${id}.png`;
            } else {
                link = `https://cdn-icons-png.flaticon.com/64/${subId}/${id}.png`;
            }




            const button = document.createElement('div');
            button.className = `button btn_${name}`;
            button.onclick = () =>
                window.open('https://' + item.link);

            const title = document.createElement('p');
            title.className = `title title_${name}`;
            title.textContent = item.title;

            const icon = document.createElement('div');
            icon.style.backgroundImage = `url(${link})`;
            icon.className = `icon icon_${name}`;

            button.appendChild(icon);
            button.appendChild(title);
            buttonsContainer.appendChild(button);
        });

        email.onclick = () => window.open('mailto:letandvar8@gmail.com', '_blanc')
        donate.onclick = () => window.open('https://ko-fi.com/letandvar', '_blanc')
    </script>
</body>

</html>
